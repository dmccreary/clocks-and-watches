<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Battery Life Calculator using Chart.js</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; }
        main { display: block; width: 100%; height: 530px; border: 1px solid silver; background: aliceblue; overflow: hidden; }
        h1 { font-size: 22px; font-weight: normal; text-align: center; margin: 8px 0 6px 0; }
        #grid { display: flex; gap: 8px; padding: 0 8px 8px 8px; height: 486px; }
        #controls { flex: 0 0 42%; background: white; border: 1px solid silver; border-radius: 8px; padding: 8px 10px; font-size: 15px; }
        #results { flex: 1 1 58%; min-width: 0; background: white; border: 1px solid silver; border-radius: 8px; padding: 8px 10px; }
        .sec { font-weight: bold; margin: 2px 0 4px 0; font-size: 15px; }
        .part { display: flex; align-items: center; margin: 3px 0; }
        .part label { flex: 1; cursor: pointer; }
        .part .ma { color: dimgray; font-size: 14px; white-space: nowrap; }
        .row { margin: 8px 0 2px 0; }
        .row input[type=range] { width: 100%; }
        select, button { font-size: 15px; }
        button { margin: 8px 6px 0 0; padding: 4px 8px; cursor: pointer; }
        #runtime { font-size: 26px; font-weight: bold; color: darkgreen; text-align: center; }
        #total { font-size: 16px; text-align: center; margin: 2px 0 2px 0; }
        #hint { font-size: 14px; text-align: center; color: #444; min-height: 18px; }
        .chartbox { position: relative; width: 100%; }
        #stackBox { height: 128px; }
        #compareBox { height: 220px; }
        @media (max-width: 520px) {
            #controls { font-size: 13px; padding: 6px; }
            .part .ma { font-size: 12px; }
            #runtime { font-size: 17px; }
            #total { font-size: 13px; }
            #hint { display: none; }
            #stackBox { height: 160px; }
            #compareBox { height: 170px; }
            button { font-size: 13px; margin: 4px 4px 0 0; padding: 3px 6px; }
            select { font-size: 13px; max-width: 100%; }
        }
    </style>
    <script src="battery-life-calculator.js"></script>
</head>
<body>
    <main>
        <h1>Battery Life Calculator</h1>
        <div id="grid">
            <div id="controls">
                <div class="sec">Parts in the clock (current while awake)</div>
                <div id="parts"></div>
                <div class="row">
                    <label for="backlight">TFT backlight brightness: <b id="blVal"></b></label>
                    <input type="range" id="backlight" min="0" max="100" step="5" value="75">
                </div>
                <div class="row">
                    <label for="sleep">Time asleep: <b id="slVal"></b></label>
                    <input type="range" id="sleep" min="0" max="95" step="5" value="0">
                </div>
                <div class="row">
                    <label for="battery">Battery: </label>
                    <select id="battery">
                        <option value="150">150 mAh (tiny LiPo)</option>
                        <option value="500" selected>500 mAh (watch LiPo)</option>
                        <option value="1000">1000 mAh (LiPo)</option>
                        <option value="2500">2500 mAh (3 x AA)</option>
                    </select>
                </div>
                <button id="saveBtn">Save as "Before"</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div id="results">
                <div id="runtime"></div>
                <div id="total"></div>
                <div id="hint"></div>
                <div class="chartbox" id="stackBox"><canvas id="stackChart"></canvas></div>
                <div class="chartbox" id="compareBox"><canvas id="compareChart"></canvas></div>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
