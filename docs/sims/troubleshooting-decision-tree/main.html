<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Troubleshooting Decision Tree using Mermaid</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; }
        main { display: block; width: 100%; height: 600px; border: 1px solid silver; overflow: hidden; background: white; }
        #topbar { height: 78px; padding: 6px 10px; border-bottom: 1px solid silver; }
        #topbar h1 { display: inline-block; font-size: 20px; font-weight: normal; margin: 0 12px 4px 0; vertical-align: middle; }
        #startOver { font-size: 15px; padding: 3px 10px; cursor: pointer; vertical-align: middle; }
        #crumbs { font-size: 14px; color: #333; line-height: 1.35; max-height: 38px; overflow: hidden; }
        #crumbs .crumb { color: #1d4f91; }
        #crumbs .ans { color: darkgreen; font-weight: bold; }
        .container { display: flex; height: 520px; }
        .diagram-panel { flex: 0 0 64%; height: 100%; background: aliceblue; padding: 8px; overflow: hidden; }
        #diagram { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #diagram svg { width: 100%; height: 100%; max-width: 100% !important; }
        #diagram .node { cursor: pointer; }
        .info-panel { flex: 1 1 36%; min-width: 0; height: 100%; background: #f8f9fa; border-left: 1px solid #dee2e6; padding: 10px 12px; overflow: hidden; font-size: 15px; line-height: 1.4; }
        .info-panel h3 { font-size: 17px; margin: 0 0 8px 0; padding-bottom: 6px; border-bottom: 2px solid steelblue; }
        .kind { display: inline-block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 6px; border-radius: 4px; color: white; margin-bottom: 6px; }
        .k-root { background: dimgray; } .k-symptom { background: steelblue; } .k-question { background: darkorange; } .k-fix { background: seagreen; }
        .label { font-weight: bold; margin-top: 8px; }
        .hint { color: #555; font-style: italic; margin-top: 10px; font-size: 14px; }
        .legend { font-size: 13px; margin-top: 12px; color: #444; }
        .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin: 0 4px 0 8px; border: 1px solid #555; }
        @media (max-width: 600px) {
            #topbar { height: 96px; }
            #crumbs { white-space: normal; font-size: 12px; max-height: 36px; }
            .container { flex-direction: column; height: 502px; }
            .diagram-panel { flex: 0 0 320px; }
            .info-panel { flex: 1 1 auto; border-left: none; border-top: 1px solid #dee2e6; font-size: 13px; padding: 6px 8px; }
            .info-panel h3 { font-size: 15px; margin-bottom: 4px; }
            .legend { display: none; }
        }
    </style>
    <script src="troubleshooting-decision-tree.js"></script>
</head>
<body>
    <main>
        <div id="topbar">
            <h1>Troubleshooting Decision Tree</h1>
            <button id="startOver">Start over</button>
            <div id="crumbs"></div>
        </div>
        <div class="container">
            <div class="diagram-panel"><div id="diagram"></div></div>
            <div class="info-panel" id="info"></div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
