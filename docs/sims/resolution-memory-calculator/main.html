<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Resolution and Memory Calculator using Chart.js</title>
    <style>
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; }
        main { background: aliceblue; border: 1px solid silver; padding: 8px 12px 6px 12px; box-sizing: border-box; }
        h2 { margin: 0 0 6px 0; font-size: 20px; text-align: center; font-weight: normal; }
        .controls { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 15px;
                    background: white; border: 1px solid silver; border-radius: 6px; padding: 6px 10px; }
        .controls label { display: flex; align-items: center; gap: 6px; }
        .controls input[type=number] { width: 64px; font-size: 15px; }
        .chart-box { position: relative; height: 300px; margin-top: 6px; background: white;
                     border: 1px solid silver; border-radius: 6px; }
        .readout { margin-top: 6px; font-size: 15px; text-align: center; }
        .legend { margin-top: 4px; font-size: 13px; text-align: center; color: #333; }
        .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin: 0 4px 0 10px; }
        @media (max-width: 560px) {
            h2 { font-size: 17px; }
            .chart-box { height: 270px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="resolution-memory-calculator.js"></script>
</head>
<body>
    <main>
        <h2>Framebuffer Memory vs. Pico RAM</h2>
        <div class="controls">
            <label>Bits per pixel
                <select id="bpp">
                    <option value="1">1 (monochrome)</option>
                    <option value="8">8 (256 colors)</option>
                    <option value="16" selected>16 (RGB565 color)</option>
                </select>
            </label>
            <label>Custom display <input type="number" id="cw" min="1" max="1000" value="400"> &times;
                <input type="number" id="ch" min="1" max="1000" value="400"></label>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <div class="readout" id="readout"></div>
        <div class="legend">
            <span class="swatch" style="background:#2e8b57"></span>under 200 KB
            <span class="swatch" style="background:#e69500"></span>200 to 264 KB (tight)
            <span class="swatch" style="background:#c0392b"></span>over 264 KB (does not fit)
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
